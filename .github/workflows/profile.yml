name: Profile — suite completa (durations)

# Profilazione della suite completa su runner GitHub.
# Perché: misurare i tempi senza scaldare la macchina locale.
# I live e2e vengono saltati con state/pause.flag (niente Ollama/orchestratore
# nei runner hosted). Il log con --durations=0 è pubblicato come artifact.
#
# Cycle 123: trigger `push` su main in aggiunta a `workflow_dispatch`.
# Motivo: il trigger manuale richiede la CLI GitHub ufficiale + auth, non
# disponibile (il `gh` locale è uno script browser 0.0.4). Con il push ogni
# commit su main esegue la suite sui runner hosted: nessuna suite locale,
# nessun LLM e nessun calore sulla macchina termicamente vincolata.
# La diagnostica di collezione stampa `tail -60 collect.log` nel log pubblico:
# così la causa del run #2 è leggibile anche senza scaricare l'artifact privato.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      filter:
        description: "Filtro -k opzionale (es. 'test_slot or test_security')"
        required: false
        default: ""

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes pytest

      - name: Pausa live e2e (niente LLM/orchestratore nei runner)
        run: |
          mkdir -p state
          touch state/pause.flag

      - name: Diagnostica collezione (--collect-only)
        run: |
          set +e
          timeout 300 python -m pytest tests/ --collect-only -q -p no:cacheprovider > collect.log 2>&1
          code=$?
          echo "EXIT=$code" >> collect.log
          echo "--- ultime righe ---"
          tail -60 collect.log
          # Cycle 124: il log del job è privato (403 senza auth). Le annotations
          # dei check run sono pubbliche: ripetere l'errore qui permette di
          # leggerlo via GET /repos/{owner}/{repo}/check-runs/{id}/annotations
          # senza credenziali e senza scaricare l'artifact. Nessun segreto:
          # l'output della collezione contiene solo nomi di test e import.
          if [ "$code" -ne 0 ]; then
            echo "::error title=collect_exit::EXIT=$code"
            tail -25 collect.log | grep -v '^$' | head -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code

      - name: Profilazione completa (--durations=0)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          FILTER="${{ github.event.inputs.filter }}"
          EXTRA=""
          if [ -n "$FILTER" ]; then EXTRA="-k $FILTER"; fi
          timeout 3300 python -m pytest tests/ -q -p no:cacheprovider \
            --durations=0 $EXTRA > pytest_profile.log 2>&1
          code=$?
          echo "EXIT=$code" >> pytest_profile.log
          echo "--- ultime righe ---"
          tail -80 pytest_profile.log
          exit $code

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-profile
          path: |
            pytest_profile.log
            collect.log
          retention-days: 14
