[timing]
orchestrator_tick = 30
worker_tick = 60
health_check = 300
git_snapshot = 999999
memory_compaction = 3600
backup_complete = 86400
model_unload_idle = 120

[safety]
# 3. Sandbox bubblewrap: true (default, sicuro) o false (locale, veloce)
sandbox_enabled = true
max_attempts = 10
max_consecutive_failures = 3
cooldown_after_failure = 120
swap_threshold = 0.95
disk_free_threshold = 1000000000
max_log_size = 10000000
heartbeat_timeout = 300
max_tasks_per_agent_per_hour = 20
memory_compaction_threshold = 50

[security]
enabled = true
max_output_chars = 10000
max_file_size_write = 2000000
max_file_size_bytes = 50000000
max_memory_mb = 1536

[routing]
